name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check proxy syntax
        run: for file in proxy/public/*/*.php; do php -l "$file"; done
      - name: Assemble the All-Inkl webroot
        run: |
          mkdir site
          cp -R dist/. site/
          cp -R proxy/public/. site/
      - name: Upload to All-Inkl
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;
            open --user \"$FTP_USERNAME\" --password \"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose site/ ./"
      - name: Check the deployed proxy
        run: |
          curl -fsS 'https://karla.liesegang.info/api/stop-events.php?stop=7000037&rows=1' | grep -q '<trias:StopEventResult>'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://karla.liesegang.info/lib/trias.php)" = 403
